<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="En esta página hay contenido de lenguaje de marcas de 1ºDAW">
    <meta name="keywords" content="html, restaurante, horario, DAW, retos">
    <meta name="author" content="Ángel López Nieto">
    <title>Reseña Flamenquín</title>
    <link rel="stylesheet" href="../css/reseña2.css">
</head>
<body>

<h2>Reseña sobre el Flamenquín</h2>

<form action="#" method="post">

    <label for="nombre">Tu nombre:</label>
    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" required>

    <label>Tipo de carne:</label>
    <div class="opciones">
        <label><input type="radio" name="carne" value="Lomo" required> Lomo</label>
        <label><input type="radio" name="carne" value="York"> Jamón York</label>
        <label><input type="radio" name="carne" value="Mixto"> Mixto</label>
    </div>

    <label>Punto del rebozado:</label>
    <div class="opciones">
        <label><input type="radio" name="rebozado" value="Crujiente" required> Crujiente</label>
        <label><input type="radio" name="rebozado" value="Suave"> Suave</label>
        <label><input type="radio" name="rebozado" value="Muy dorado"> Muy dorado</label>
    </div>

    <label for="valoracion">Valoración (1 a 5):</label>
    <input type="number" id="valoracion" name="valoracion" min="1" max="5" required>

    <label for="comentario">Comentario:</label>
    <textarea id="comentario" name="comentario" rows="4" placeholder="Escribe tu opinión..." required></textarea>

    <button type="submit">Enviar reseña</button>

</form>

</body>
</html>
